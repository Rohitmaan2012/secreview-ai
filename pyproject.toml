[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secreview-ai"
version = "1.0.0"
description = "AI-powered security code review: find vulnerabilities, suggest secure fixes, generate assessment reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=2.5.0", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
secreview = "secreview.cli:main"

[tool.setuptools.packages.find]
include = ["secreview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
